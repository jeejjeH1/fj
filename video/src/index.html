<style>

:root {

* { box-sizing: border-box; margin: 0; padding: 0; }

body { font-family: 'Inter', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

.abs { position: absolute; }

.red { color: var(--red); } .green { color: var(--green); } .or { color: var(--or); } .vi { color: var(--vi); }

.panel.vi-edge { border-color: rgba(139, 124, 255, .4); box-shadow: 0 50px 120px rgba(0, 0, 0, .65), 0 0 60px rgba(139, 124, 255, .15), inset 0 1px 0 rgba(255, 255, 255, .09); }
.chip { display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); font: 600 24px/1 'Inter'; white-space: nowrap; }
